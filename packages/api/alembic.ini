# Alembic configuration file

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
file_template = %%(year)d_%(month)02d_%(day)02d_%(hour)02d_%(minute)02d_%(second)02d)_%%(slug)s

# set to 'true' to run the environment during
# the migration for each branch
prepend_sys_path = .

# version path separator
version_path_separator = os

# timezone
timezone = UTC

[post_write_hooks]
# hooks are run after the migration file is generated and committed
# black = formatter
# isort = sorter
# hook_type = black|isort|lint|flake8|mypy
