version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: goia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: goia
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - goia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: goia-backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/goia
      - DATABASE_ASYNC_URL=postgresql+asyncpg://postgres:postgres@db:5432/goia
      - JWT_SECRET_KEY=goia-super-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:8000
      - DEBUG=true
    ports:
      - "8000:8000"
    volumes:
      - ./packages/api:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - goia-network
    command: >
      sh -c "python -m app.seed_data && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: goia-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - goia-network

volumes:
  db-data:

networks:
  goia-network:
    driver: bridge
